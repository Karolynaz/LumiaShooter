name: Build ARM sideload package

on:
  push:
  workflow_dispatch:

jobs:
  build-arm:
    # windows-2022 = Visual Studio 2022 with the UWP workload, .NET Native and ARM tools,
    # plus Windows SDK 10.0.17763 (the oldest SDK on hosted runners; 15063 is not installed).
    runs-on: windows-2022
    env:
      # The project targets SDK 15063; the runner only has 17763+, so CI compiles against 17763.
      # TargetPlatformMinVersion stays 10.0.10586.0, so the package still installs on build 14393.
      TARGET_SDK: 10.0.17763.0
    steps:
      - uses: actions/checkout@v7

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Show build environment
        shell: pwsh
        run: |
          msbuild -version
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Platforms\UAP" | Select-Object Name
          Get-ChildItem "C:\Program Files (x86)\Microsoft SDKs\Windows Kits\10\ExtensionSDKs\Microsoft.VCLibs" -Recurse -Filter *.appx -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Build Release|ARM sideload package
        shell: pwsh
        run: |
          msbuild LumiaShooter.sln /restore /m /v:minimal `
            /p:Configuration=Release /p:Platform=ARM `
            /p:TargetPlatformVersion=$env:TARGET_SDK `
            /p:GenerateAppxPackageOnBuild=true `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile=LumiaShooter_TemporaryKey.pfx `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\AppPackages\\"

      - name: List and check package output
        shell: pwsh
        run: |
          Get-ChildItem AppPackages -Recurse -Include *.appx,*.cer | Select-Object FullName, Length
          # Sanity check: ARM package that still installs on Windows 10 Mobile 1607 (14393).
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $appx = Get-ChildItem AppPackages -Recurse -Filter "LumiaShooter_*_ARM.appx" | Select-Object -First 1
          $zip = [System.IO.Compression.ZipFile]::OpenRead($appx.FullName)
          $reader = New-Object System.IO.StreamReader($zip.GetEntry("AppxManifest.xml").Open())
          [xml]$m = $reader.ReadToEnd(); $reader.Close(); $zip.Dispose()
          $arch = $m.Package.Identity.ProcessorArchitecture
          $min = $m.Package.Dependencies.TargetDeviceFamily.MinVersion
          Write-Host "ProcessorArchitecture=$arch MinVersion=$min"
          if ($arch -ne "arm") { throw "Package is not ARM" }
          if ([version]$min -gt [version]"10.0.14393.0") { throw "MinVersion $min is too new for the Lumia 735" }

      - name: Upload sideload package
        uses: actions/upload-artifact@v7
        with:
          name: LumiaShooter-ARM-sideload
          # Only the ARM app package, its certificate and the ARM dependency packages.
          path: |
            AppPackages/*/LumiaShooter_*_ARM.appx
            AppPackages/*/LumiaShooter_*_ARM.cer
            AppPackages/*/Dependencies/ARM/*.appx
          if-no-files-found: error
